server.port=8089

spring.application.name=employee-management-system

# PostgreSQL Database


spring.datasource.url=jdbc:postgresql://localhost:5433/emsdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate
spring.jpa.open-in-view=false

# Cache
spring.cache.type=simple

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT
app.jwt.secret=c2VjdXJlLWludGVydmlldy1wcmVwLWp3dC1zZWNyZXQta2V5LTI1Ni1iaXRzLW1pbmltdW0h
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000

# Logging
logging.level.com.interviewprep.ems=DEBUG
logging.level.org.springframework.security=INFO